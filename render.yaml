# LEGACY: Render is no longer the production target. See DEPLOYMENT.md.
services:
  - type: web
    name: ables-home-healthcare
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /healthz
    autoDeploy: false
    # NOTE: Free web services have no persistent disk, so uploads and any
    # local files are ephemeral (lost on restart/redeploy). Relational data
    # lives in the Postgres database below.
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FLASK_ENV
        value: production
      - key: FORCE_HTTPS
        value: "true"
      - key: AUTO_MIGRATE_ON_STARTUP
        value: "false"
      - key: SITE_BASE_URL
        value: https://ables-home-healthcare-6.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ables-postgres
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /var/lib/ables-uploads
      - key: MAX_CONTENT_LENGTH
        value: "5242880"
      - key: SESSION_HOURS
        value: "8"
      - key: WTF_CSRF_TIME_LIMIT
        value: "3600"
      - key: ACCOUNT_LOCKOUT_ATTEMPTS
        value: "5"
      - key: ACCOUNT_LOCKOUT_MINUTES
        value: "15"
      - key: ADMIN_RECOVERY_CODES_REQUIRED
        value: "true"
      - key: ADMIN_EMAIL
        value: admin@ableshomehealthcare.com
      - key: MAIL_DEFAULT_SENDER
        value: admin@ableshomehealthcare.com
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_USE_TLS
        value: "true"
      - key: ENABLE_SMS_REMINDERS
        value: "false"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: VIRUS_SCAN_COMMAND
        sync: false
      - key: BUSINESS_DETAILS_CONFIRMED
        value: "false"
      - key: LEGAL_SCOPE_CONFIRMED
        value: "false"
      - key: LEGAL_PRIVACY_REVIEW_CONFIRMED
        value: "false"
      - key: APPROVED_PHOTOS_READY
        value: "false"

databases:
  - name: ables-postgres
    plan: free
    # NOTE: Free Postgres expires 30 days after creation, has no backups,
    # and is limited to 1 GB. Upgrade to a paid plan before real use.
