<div class="password-helper" data-password-helper>
    <div class="password-row">
        <label class="form-label" for="{{ password_id }}">{{ password_label }}</label>
        <button class="password-toggle" type="button" data-password-toggle="{{ password_id }}">Show</button>
    </div>
    <input
        id="{{ password_id }}"
        name="{{ password_name|default('password') }}"
        type="password"
        class="form-control"
        required
        minlength="12"
        autocomplete="{{ autocomplete|default('new-password') }}"
        data-password-input
        aria-describedby="{{ password_id }}Help"
    >
    <div class="password-meter" aria-hidden="true">
        <span></span>
    </div>
    <div class="password-status" id="{{ password_id }}Help" data-password-status>
        Start with at least 12 characters. Mix uppercase, lowercase, number, and symbol.
    </div>
    <ul class="password-rules">
        <li data-rule="length">At least 12 characters</li>
        <li data-rule="upper">Uppercase letter</li>
        <li data-rule="lower">Lowercase letter</li>
        <li data-rule="number">Number</li>
        <li data-rule="symbol">Symbol</li>
        <li data-rule="common">No common words like password, admin, ables, or 123456</li>
    </ul>
</div>
