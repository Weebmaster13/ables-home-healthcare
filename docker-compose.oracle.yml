# Ables Home Healthcare on Oracle Cloud Always Free (single VM)
# $0/mo: 1x Ampere A1 (2 OCPU / 12 GB) + 50 GB boot disk in home region.
# Postgres + app + nginx all on this host. Railway stays live until cutover.
#
# Secrets live ONLY in `.env.oracle` on the VM (never committed — see
# .gitignore). Copy `.env.oracle.example` there and fill it in on the server.
name: ables

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env.oracle
    environment:
      POSTGRES_DB: ables
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.oracle
    environment:
      FLASK_ENV: production
      # NOTE: FORCE_HTTPS is intentionally NOT pinned here. The app defaults
      # it on in production (correct behind TLS-terminating Nginx); test and
      # staging environments set FORCE_HTTPS=false in their own env file.
      AUTO_MIGRATE_ON_STARTUP: "true"
      SITE_BASE_URL: https://ableshomehealthcare.com
      UPLOAD_FOLDER: /app/instance/uploads
      MAX_CONTENT_LENGTH: "5242880"
      ADMIN_EMAIL: admin@ableshomehealthcare.com
      MAIL_DEFAULT_SENDER: admin@ableshomehealthcare.com
      MAIL_PORT: "587"
      MAIL_USE_TLS: "true"
      ENABLE_SMS_REMINDERS: "false"
    expose:
      - "5000"
    volumes:
      - uploads:/app/instance/uploads
    command: >
      sh -c "flask --app app db upgrade &&
             gunicorn wsgi:app --bind 0.0.0.0:5000 --workers 2 --threads 4 --timeout 120"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/healthz',timeout=10)\""]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.oracle.conf:/etc/nginx/conf.d/default.conf:ro
      - certdata:/etc/letsencrypt

volumes:
  pgdata:
  uploads:
  certdata:
