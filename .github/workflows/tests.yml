# Fast unit/regression suite. The deployment-smoke workflow only triggers on a
# narrow path list, so a test-only or config-only commit previously produced no
# CI record at all. This runs the suite on every push and pull request so the
# pass/fail count is independently verifiable.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the cPanel target interpreter reported by preflight_cpanel.py.
          python-version: "3.11"

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyyaml

      - name: Run the test suite
        run: python -m pytest -q

  # Runs the live MySQL/MariaDB tests (connection + full backup/restore round
  # trip) against a real server, so the documented restore drill is verified
  # reproducibly rather than only by hand. Without MYSQL_TEST_URL those tests
  # skip, which is why this job sets it.
  pytest-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyyaml

      - name: Verify the live server is reachable
        run: |
          mysql --version
          mysqladmin --protocol=tcp --host=127.0.0.1 --port=3306 --user=root --password=root ping

      - name: Run the suite with the live database drill enabled
        env:
          MYSQL_TEST_URL: "mysql+pymysql://root:root@127.0.0.1:3306/"
        run: python -m pytest -q
