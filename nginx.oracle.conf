# Nginx in front of the Flask app (port 80; certbot adds 443 at cutover)
upstream ables {
    server web:5000;
}

# Canonical host is the apex. www redirects here (harmless before cutover:
# no www traffic can reach this server until DNS moves).
server {
    listen 80;
    server_name www.ableshomehealthcare.com;
    return 301 https://ableshomehealthcare.com$request_uri;
}

server {
    listen 80;
    server_name ableshomehealthcare.com;

    client_max_body_size 6m;

    location / {
        proxy_pass http://ables;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
